[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openir-specification"
version = "1.0.0"
description = "Schemas e documentação normativa do padrão OpenIR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
