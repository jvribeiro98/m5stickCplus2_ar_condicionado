[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openir-specification"
version = "1.0.0"
description = "Schemas e documentação normativa do padrão OpenIR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
