name: Compilar e publicar firmware

on:
  push:
    branches: [main]
    paths:
      - "meu_ar_stick.ino"
      - "web/**"
      - ".github/workflows/build-and-deploy-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar suporte ESP32
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Instalar bibliotecas
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "M5StickCPlus2"
          arduino-cli lib install "IRremoteESP8266"

      - name: Preparar sketch
        run: |
          mkdir -p .build/sketch
          cp meu_ar_stick.ino .build/sketch/sketch.ino

      - name: Compilar
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path .build/output \
            .build/sketch

      - name: Criar firmware único
        run: |
          python3 -m pip install --disable-pip-version-check esptool==4.8.1
          python3 -m esptool \
            --chip esp32 \
            merge_bin \
            -o web/firmware.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x1000 .build/output/sketch.ino.bootloader.bin \
            0x8000 .build/output/sketch.ino.partitions.bin \
            0xe000 .build/output/boot_app0.bin \
            0x10000 .build/output/sketch.ino.bin

      - name: Registrar versão no manifesto
        env:
          VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("web/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"][:7]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validar arquivos publicados
        run: |
          test -s web/index.html
          test -s web/manifest.json
          test -s web/firmware.bin

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar conteúdo do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
